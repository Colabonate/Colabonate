services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colabonate
      POSTGRES_USER: colabonate
      POSTGRES_PASSWORD: dev
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colabonate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  lnbits:
    image: lnbits/lnbits:latest
    ports:
      - "5000:5000"
    environment:
      LNBITS_BACKEND_WALLET_CLASS: VoidWallet
      LNBITS_SITE_TITLE: Colabonate LNBits (Dev)
      LNBITS_ADMIN_UI: "true"
      LNBITS_ALLOWED_USERS: ""
    volumes:
      - lnbits_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/wallet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pg_data:
  meili_data:
  lnbits_data:
