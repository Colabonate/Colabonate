name: Nightly Tests

# ADR-377 (silent production launch 2026-09-18, colabonate.app): while the
# product is quietly live, the full test surface must run on a fixed cadence
# even when nobody pushes — that was exactly the gap that let the dock test
# and the demo-seller bug sit silently red before ADR-377.
#
# Two jobs:
#   full-e2e  — the complete Playwright suite (dock, guide nav, journeys on
#               desktop + mobile) against a fresh CI stack.
#   live-smoke — read-only production drill against the deployed app
#               (tests/live, no local servers, no mutations).
#
# Alarm: GitHub emails the scheduling account when a scheduled workflow
# fails — no extra wiring needed. If that ever proves insufficient, route
# failures through Resend (already used for CRITICAL alerts).

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colabonate_test
          POSTGRES_USER: colabonate
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd="pg_isready -U colabonate -d colabonate_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: test-master-key-16b
          MEILI_ENV: production
        options: >-
          --health-cmd="curl -f http://localhost:7700/health"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: npx pnpm install --frozen-lockfile

      # Generate design-system tokens (tokens.css is gitignored). Without this
      # the Playwright webServer's Vite fails: "Can't resolve
      # '@ds/tokens/css/tokens.css'" (imported by apps/colabonate-app/src/index.css).
      # Mirrors mobile-build.yml and the app Dockerfile.
      - name: Generate design-system tokens
        run: npx pnpm tokens:build

      - name: Generate Prisma client
        run: npx pnpm prisma generate --schema prisma/schema.prisma

      - name: Setup test database
        run: |
          npx pnpm prisma db push --force-reset --schema prisma/schema.prisma
          npx pnpm --filter server exec tsx ../../prisma/seed.ts
        env:
          DATABASE_URL: postgresql://colabonate:test@localhost:5432/colabonate_test

      - name: Run Vitest
        run: npx pnpm test
        env:
          PAYMENT_PROVIDER: mock
          DATABASE_URL: postgresql://colabonate:test@localhost:5432/colabonate_test

      - name: Install Playwright browsers
        run: npx pnpm playwright:install chromium

      - name: Run full Playwright suite (all projects, all tags)
        run: npx pnpm test:e2e
        env:
          PAYMENT_PROVIDER: mock
          DATABASE_URL: postgresql://colabonate:test@localhost:5432/colabonate_test
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_SERVER_URL: http://localhost:4001
          REDIS_URL: redis://localhost:6379
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_MASTER_KEY: test-master-key-16b
          SEARCH_BACKEND: meilisearch
          DEMO_LOGIN_ENABLED: '1'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: playwright-report/
          # Artifact storage quota is shared org-wide; keep the window short.
          retention-days: 3

  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: npx pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx pnpm playwright:install chromium

      # Read-only drill against production — deliberately no services, no
      # database, no local web servers (playwright.live.config.ts).
      - name: Run live production smoke
        run: npx pnpm test:live
        env:
          PLAYWRIGHT_LIVE_BASE_URL: https://colabonate.app

      - name: Upload Live Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-live-report
          path: playwright-live-report/
          retention-days: 3
