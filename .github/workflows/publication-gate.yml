name: publication-gate

# Builds the curated public mirror and runs the negative gate + secret scan.
# This only *checks and reports* — it never pushes to the public repo. The
# publish itself stays a human step (scripts/publication/publish.sh --push).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build curated mirror and run negative gate + secret scan
        run: python3 scripts/publication/build-public-mirror.py
