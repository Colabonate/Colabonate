<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1e242c" />
    <title>Colabonate</title>

    <!-- SEO / social defaults — overridden per route by <Seo /> (src/components/Seo.tsx) -->
    <meta
      name="description"
      content="Colabonate is the peer-to-peer marketplace to buy, sell and cooperate directly — with Bitcoin Lightning payments, Nostr identity and community-governed escrow."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://colabonate.app/" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- ADR-414: agent entry points (also sent as an HTTP Link header by nginx) -->
    <link rel="describedby" href="/llms.txt" type="text/plain" />
    <link rel="describedby" href="/agents.md" type="text/markdown" />
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" type="application/ai-catalog+json" />

    <meta property="og:site_name" content="Colabonate" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Colabonate" />
    <meta
      property="og:description"
      content="Buy, sell & cooperate — directly, peer-to-peer. Bitcoin Lightning payments, Nostr identity, community-governed escrow."
    />
    <meta property="og:url" content="https://colabonate.app/" />
    <meta property="og:image" content="https://colabonate.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Colabonate — the peer-to-peer marketplace" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Colabonate" />
    <meta
      name="twitter:description"
      content="Buy, sell & cooperate — directly, peer-to-peer. Bitcoin Lightning payments, Nostr identity, community-governed escrow."
    />
    <meta name="twitter:image" content="https://colabonate.app/og-image.png" />

    <!-- Structured data (schema.org). JSON-LD is a non-executable data block,
         so the strict script-src 'self' CSP does not apply to it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://colabonate.app/#organization",
            "name": "Colabonate",
            "url": "https://colabonate.app/",
            "logo": "https://colabonate.app/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://colabonate.app/#website",
            "url": "https://colabonate.app/",
            "name": "Colabonate",
            "publisher": { "@id": "https://colabonate.app/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Colabonate",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://colabonate.app/",
            "description": "Peer-to-peer marketplace to buy, sell and cooperate directly — with Bitcoin Lightning payments, Nostr identity and community-governed escrow.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
    <!-- Prevent FOUC: Apply theme before React hydration (external for CSP) -->
    <script src="/theme-init.js"></script>
    <style>
      /* Critical splash styles — inline so the splash renders correctly
         on the very first paint, before index.css (loaded via main.tsx) is parsed. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 24px;
        z-index: 9999;
        pointer-events: none;
        /* Must be opaque: the splash is meant to *cover* the app while it
           mounts/re-mounts (see the --force-visible comment below), not just
           float a logo over already-visible content. Without a background,
           real page content (already painted and interactive underneath)
           shows straight through — visible as a stray logo/spinner ghosting
           over live text/cards until app-ready fires. */
        background: var(--theme-bg, #ffffff);
        transition: opacity 240ms ease, visibility 0s linear 240ms;
      }
      /* var(--theme-bg) only resolves once index.css (loaded async via
         main.tsx) has parsed its [data-theme="dark"] rule — until then the
         fallback above applies, which must be the LIGHT color regardless of
         the actual theme. theme-init.js sets data-theme synchronously before
         this stylesheet block is even reached, so this higher-specificity
         override (attribute selector + id, beats a bare #app-splash rule
         regardless of source order) picks the correct dark background
         immediately, with no dependency on index.css's load timing — the
         exact gap that caused a white flash on a genuinely dark-themed
         reload (e.g. the 'time' preference at night, see theme-init.js).
         Keep this hex value in sync with --theme-bg's dark value
         (--color-secondary-80, packages/tokens/css/tokens.css). */
      html[data-theme="dark"] #app-splash { background: #252c33; }
      #app-splash.app-splash--hidden { opacity: 0; visibility: hidden; }
      /* ADR-287 post-launch fix: forces the splash instantly visible while
         main.tsx's createRoot() remounts over a prerendered snapshot (whose
         #app-splash is already baked in as --hidden). !important guarantees
         this wins over --hidden regardless of class order; removing this
         class hands control straight back to the rule above with no inline
         style state left behind to clear. */
      #app-splash.app-splash--force-visible {
        transition: none !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
      #app-splash .app-splash__logo {
        width: 56px;
        height: 56px;
        display: block;
      }
      #app-splash .app-splash__logo path { fill: #e84541; }
      #app-splash .app-splash__spinner {
        width: 18px;
        height: 18px;
        display: block;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.08);
        border-top-color: #e84541;
        animation: app-splash-spin 0.9s linear infinite;
      }
      /* Divider + radial pulse above the tagline — same recipe as the login
         divider (LoginTabs.tsx / index.css), inlined here because the splash
         must render correctly before index.css is parsed. */
      #app-splash .app-splash__divider {
        position: relative;
        width: 100%;
        max-width: 360px;
        margin-top: 4px;
      }
      #app-splash .app-splash__divider-line {
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--color-primary-50, #e84541) 50%, transparent);
      }
      #app-splash .app-splash__divider-glow {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        transform-origin: 50% 0%;
        width: min(100%, 420px);
        height: 110px;
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
        pointer-events: none;
        background: radial-gradient(60% 100% at 50% 0%, color-mix(in srgb, var(--color-primary-50, #e84541) 34%, transparent) 0%, color-mix(in srgb, var(--color-primary-50, #e84541) 12%, transparent) 28%, color-mix(in srgb, var(--color-primary-50, #e84541) 3%, transparent) 55%, transparent 78%);
        animation: app-splash-glow-pulse 5.5s ease-in-out infinite;
      }
      @keyframes app-splash-glow-pulse {
        0%, 100% { opacity: 0.55; scale: 0.96 1; }
        50%      { opacity: 1;    scale: 1 1.04; }
      }
      #app-splash .app-splash__subtitle {
        margin: 4px 0 0;
        max-width: 360px;
        width: 100%;
        text-align: center;
        font: 500 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--theme-text-secondary, #6b7280);
        letter-spacing: 0.01em;
        transition: opacity 360ms ease;
        min-height: 38px;
        /* Gradient text: same recipe as the divider line, so both edges fade
           out to transparent (no opaque token fallback flashing at load). */
        background: linear-gradient(90deg, transparent 0%, var(--color-primary-50, #e84541) 50%, transparent 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      #app-splash .app-splash__subtitle.is-fading { opacity: 0; }
      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash__spinner { animation: none; }
        #app-splash .app-splash__divider-glow { animation: none; }
        #app-splash .app-splash__subtitle { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- Initial splash: centered logo + spinner + rotating tagline, removed by
         React on mount. It MUST stay BEFORE #root: the prerendered snapshot's
         #root carries build-time markup captured in its default client state
         (e.g. a notice/section the visitor had already dismissed), and a
         browser can progressively paint that markup on a slow connection
         before a later-positioned splash/guard is parsed — that window is the
         exact reason stale Beta-notice content flashed on reload. This element
         is fixed, opaque and z-9999, so DOM order alone decides what paints
         first. -->
    <div id="app-splash" aria-hidden="true">
      <svg class="app-splash__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55.1 55.1">
        <path d="M17.92,14c0,2-1.59,2.94-3.56,2.94S10.8,16,10.8,14a3.56,3.56,0,0,1,7.12,0Z" />
        <path d="M44.3,14c0,2-1.59,2.94-3.56,2.94S37.18,16,37.18,14a3.56,3.56,0,0,1,7.12,0Z" />
        <path d="M43.26,21.79q-6.61-.22-13.6-.26a.48.48,0,0,0-.32.15L27.9,23.25a.48.48,0,0,1-.7,0l-1.44-1.57a.48.48,0,0,0-.32-.15q-7,0-13.6.26a1.42,1.42,0,0,0-1,.42,1.49,1.49,0,0,0-.41,1v6.36a16.86,16.86,0,0,0,14.86,15.2.82.82,0,0,0,.59-.27l1-1.12a.88.88,0,0,1,1.3,0l1,1.12a.84.84,0,0,0,.59.27,16.86,16.86,0,0,0,14.86-15.2V23.23A1.43,1.43,0,0,0,43.26,21.79Zm-4.18,7.8C39.08,35,33.91,39,27.55,39S16,35,16,29.59V28.51a1.37,1.37,0,0,1,1.36-1.44c3,.23,6.49.55,10.4.53,3.72,0,7.45-.41,9.94-.53a1.32,1.32,0,0,1,1.36,1.44Z" />
      </svg>
      <div class="app-splash__spinner" role="status" aria-label="Loading"></div>
      <div class="app-splash__divider" aria-hidden="true">
        <div class="app-splash__divider-line"></div>
        <div class="app-splash__divider-glow"></div>
      </div>
      <p class="app-splash__subtitle" id="app-splash-subtitle">Buy, sell &amp; cooperate, directly peer-to-peer.</p>
    </div>
    <!-- Anti-FOUC guard: forces the splash visible synchronously, before first
         paint, so a prerendered snapshot's stale #root content never flashes
         through (external for CSP; must stay a plain blocking script — no
         defer/async/module — and must stay positioned right here: immediately
         after #app-splash exists and BEFORE #root, so it wins the parse race
         against the stale snapshot markup). -->
    <script src="/splash-guard.js"></script>
    <!-- Splash tagline rotation (external for CSP) -->
    <script src="/splash-init.js"></script>
    <!-- React mounts here. Deliberately placed AFTER the splash + guard (see
         note on #app-splash above). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
