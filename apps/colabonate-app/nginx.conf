server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # ADR-295 image-quality uplift: allow large JSON offer bodies
    # (data-URL images) through to the API proxy; default would be 1 MB.
    client_max_body_size 12m;

    # F-D7-02: Content-Security-Policy — strict script-src 'self' (no inline).
    # Inline scripts externalized to /theme-init.js + /splash-init.js (public/).
    # style-src 'unsafe-inline' still needed for Emotion CSS-in-JS + splash styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # React Router: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ADR-414: agent-facing static files. Whether nginx's stock mime.types
    # types `.md` depends on the nginx version, and neither file declares a
    # charset (both contain non-ASCII punctuation), so type and charset are
    # pinned explicitly. add_header in a location block drops the server-level
    # CSP, so it is repeated.
    location = /agents.md {
        default_type  text/markdown;
        charset       utf-8;
        charset_types text/markdown;   # not in nginx's default charset_types
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    location = /llms.txt {
        default_type text/plain;
        charset      utf-8;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # ADR-414: a /.well-known/ path that has no real file must be a 404, not
    # the SPA's index.html (a 200 text/html soft-404 made every probe for
    # agent-card.json / server-card / nostr.json look like a valid answer).
    # Real endpoints (lnurlp, nostr.json, MCP card) are proxied to Express
    # BEFORE this server by nginx/beta-proxy.conf. `^~` stops the extension
    # regexes below from capturing /.well-known/*.png etc.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # ADR-414 D6 / FU-955: MCP Server Card (SEP-2127) at <streamable-http-url>/server-card and the
    # domain-level AI Catalog. Spec rules: media type per resource; CORS MUST (GET only, ETag exposed);
    # `Cache-Control: public, max-age=3600` SHOULD; ETag + If-None-Match → 304 (nginx does this for
    # static files). `/mcp` itself is proxied to the MCP service by nginx/beta-proxy.conf with an
    # EXACT match, so `/mcp/server-card` falls through to this app. The card is public by design.
    location = /mcp/server-card {
        types { application/mcp-server-card+json json; }
        charset       utf-8;
        charset_types application/mcp-server-card+json;
        limit_except GET { deny all; }
        try_files /mcp/server-card.json =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET" always;
        add_header Access-Control-Allow-Headers "Content-Type, If-None-Match" always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    location = /.well-known/ai-catalog.json {
        types { application/ai-catalog+json json; }
        charset       utf-8;
        charset_types application/ai-catalog+json;
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET" always;
        add_header Access-Control-Allow-Headers "Content-Type, If-None-Match" always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # ADR-414 D8: hosted Agent Skills (SKILL.md + references/) and their discovery
    # indexes. Both prefixes use `^~` so they win over the .well-known 404 rule above
    # and over the extension regexes below. Indexes are generated at build time by
    # scripts/skills-index.mjs (digests over the served bytes).
    location ^~ /.well-known/agent-skills/ {
        # Discovery-RFC server rules: index.json as application/json, SKILL.md as
        # text/markdown, GET/HEAD only, 404 for anything missing. `types` replaces
        # the stock map for this location so `.md` is typed regardless of the
        # nginx version; CORS because browser-based clients may fetch the skill.
        types {
            application/json json;
            text/markdown    md;
        }
        default_type  text/plain;
        charset       utf-8;
        charset_types text/markdown application/json text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    location ^~ /.well-known/skills/ {
        # Discovery-RFC server rules: index.json as application/json, SKILL.md as
        # text/markdown, GET/HEAD only, 404 for anything missing. `types` replaces
        # the stock map for this location so `.md` is typed regardless of the
        # nginx version; CORS because browser-based clients may fetch the skill.
        types {
            application/json json;
            text/markdown    md;
        }
        default_type  text/plain;
        charset       utf-8;
        charset_types text/markdown application/json text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # Cache static assets aggressively; index.html must not be cached.
    # NOTE: nginx add_header in a location block overrides ALL server-level
    # add_header directives, so the CSP must be repeated here.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Link '</llms.txt>; rel="describedby"; type="text/plain", </agents.md>; rel="describedby"; type="text/markdown", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/ai-catalog+json"' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    # Prerendered public-route snapshots (SEO/LLM): must revalidate on every
    # navigation so a deploy's new snapshot is picked up immediately. The
    # former 1h public cache could serve a stale snapshot after a deploy
    # (old client-state-dependent UI baked in its default state), which the
    # splash could only mask, not fix — see ADR-393. `no-cache` (revalidate,
    # 304 on unchanged) rather than `no-store`: still cheap, never stale.
    # nginx location-level add_header overrides the server-level CSP, so it
    # must be repeated here.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Link '</llms.txt>; rel="describedby"; type="text/plain", </agents.md>; rel="describedby"; type="text/markdown", </.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/ai-catalog+json"' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
}
